version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: domera_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: domera_db
    ports:
      # Only reachable from the server itself, not from the internet
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domera_backend
    restart: always
    ports:
      # Plain HTTP, kept for older app builds. New builds should use https://$DOMAIN/api
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/domera_db?schema=public
      JWT_ACCESS_SECRET: domera_super_secret_access_key_2026_change_in_prod
      JWT_REFRESH_SECRET: domera_super_secret_refresh_key_2026_change_in_prod
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ADMIN_NAME: "Admin User"
      ADMIN_EMAIL: "admin@domera.com"
      ADMIN_PHONE: "+998900000000"
      ADMIN_PASSWORD: "AdminPassword123!"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080"
      TRUST_PROXY: "true"
      # Push notifications: base64 of the Firebase service account JSON
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
    volumes:
      # Keep uploaded images across container rebuilds
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    container_name: domera_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
